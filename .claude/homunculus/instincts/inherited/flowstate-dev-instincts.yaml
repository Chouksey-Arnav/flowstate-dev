# Flowstate Dev Workflow Ui Polish Or Enhancement Pass

## Action

Follow the ui-polish-or-enhancement-pass workflow:
1. Update shared layout files (e.g., app/(app)/layout.tsx) to add wrappers or providers
2. Add or update animation/transition components under components/layout/
3. Modify feature list components (e.g., components/tasks/list.tsx, components/habits/habit-list.tsx) to support new UI behaviors
4. Add new navigation or responsive UI elements (e.g., mobile nav)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: app/(app)/layout.tsx, components/layout/*.tsx, components/tasks/list.tsx

