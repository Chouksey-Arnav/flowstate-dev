# Flowstate Dev Workflow Add New Feature Page

## Action

Follow the add-new-feature-page workflow:
1. Create or update the page file under app/(app)/[feature]/page.tsx
2. Add multiple new components under components/[feature]/*
3. Optionally add or update supporting files in lib/, hooks/, or store/
4. Wire up state management and UI interactions

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: app/(app)/[feature]/page.tsx, components/[feature]/*.tsx, lib/[feature].ts

