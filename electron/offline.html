<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flowstate — offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0a0f;
        color: #d4d4d8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        -webkit-app-region: drag;
      }
      h1 { font-size: 1.25rem; margin-bottom: 8px; color: #fafafa; }
      p { color: #a1a1aa; max-width: 28rem; }
      button {
        margin-top: 20px;
        background: #fafafa;
        color: #0a0a0f;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 600;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>No connection yet</h1>
      <p>
        Flowstate needs to load once with an internet connection before it can work offline.
        After that, previously visited pages stay available without a connection.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
